<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M. Brandon Westover, MD, PhD — Curriculum Vitae</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    background: #ececec;
    color: #222;
  }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: #222; color: #fff;
    padding: 10px 20px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; line-height: 1.4;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .topbar a { color: #6cf; text-decoration: none; margin-left: 18px; }
  .topbar a:hover { text-decoration: underline; }
  .pages { max-width: 900px; margin: 24px auto; padding: 0 12px; }
  .pages img {
    display: block;
    width: 100%;
    height: auto;
    margin-bottom: 16px;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    border: 1px solid #ddd;
  }
  .pageno {
    color: #888; font-size: 12px;
    text-align: right;
    margin: -10px 4px 18px 0;
  }
</style>
</head>
<body>
<div class="topbar">
  <span><strong>M. Brandon Westover, MD, PhD</strong> &mdash; Curriculum Vitae</span>
  <span>
    <a href="/cv/1-Westover_CV.pdf" download="Westover_CV.pdf">Download PDF</a>
    <a href="/brandon/">&larr; Back to bio</a>
  </span>
</div>

<div class="pages">
{% for i in (1..44) %}
  {% assign n = i | prepend: '00' | slice: -2, 2 %}
  <img src="/cv/pages/page-{{ n }}.jpg" alt="CV page {{ i }}" loading="lazy">
  <div class="pageno">page {{ i }} / 44</div>
{% endfor %}
</div>

</body>
