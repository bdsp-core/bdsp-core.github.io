# Hand-picked tools shown first on /code/ ("Start with the task you have").
# Edit freely: each entry is one card. `status` is optional; use one of
# "Maintained", "Paper code" or "Experimental" once the maintainer has confirmed it.
- task: Score a clinical sleep study
  name: CAISR
  takes: Polysomnography recordings
  gives: Sleep stages, arousals, respiratory events and limb movements
  url: https://github.com/bdsp-core/CAISR-App
- task: Interpret a clinical EEG automatically
  name: MORGOTH
  takes: Clinical EEG
  gives: Classification of EEG patterns and seizures
  url: https://github.com/bdsp-core/morgoth
- task: Classify seizures and related ICU patterns
  name: SPaRCNet
  takes: ICU EEG segments
  gives: Seizure, LPD, GPD, LRDA, GRDA or other
  url: https://github.com/bdsp-core/IIIC-SPaRCNet
- task: Detect epileptiform spikes
  name: SpikeNet
  takes: Routine EEG
  gives: Detections of interictal epileptiform discharges
  url: https://github.com/bdsp-core/SpikeNet2
- task: Describe rhythmic and periodic EEG patterns
  name: GROND
  takes: ICU EEG
  gives: Quantitative descriptors of each pattern
  url: https://github.com/bdsp-core/grond
- task: Estimate brain age from sleep
  name: SleepEEGBasedBrainAge
  takes: Overnight sleep EEG
  gives: A brain age estimate
  url: https://github.com/bdsp-core/SleepEEGBasedBrainAge
