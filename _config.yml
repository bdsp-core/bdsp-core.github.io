# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: CDAC - The Westover Lab at Stanford
email: mbwest@stanford.edu
description: > # this means to ignore newlines until "baseurl:"
  CDAC, the Westover Lab at Stanford: AI methods for EEG, sleep recordings and clinical records, with the data and tools shared for other researchers.
baseurl: ""
url: "https://bdsp-core.github.io"

include:
  - .htaccess
  - _pages

# Working files that must not be published.
exclude:
  - README.md
  - AUTOMATED_PUBLICATIONS.md
  - SETUP_GOOGLE_SHEETS_SYNC.md
  - how_to_locally_edit_and_push.md
  - requirements.txt
  - "*.py"
  - "*.ipynb"
  - _pages/*.csv
  - scrapeNCBI
  - fun/src
  - images/teampic/original_backup
  - _config_preview.yml
  - _config_preview_clean.yml
  - preview.sh
  - vendor
  - venv
  - Gemfile
  - Gemfile.lock

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

# Plugins (GitHub Pages-whitelisted only)
plugins:
  - jekyll-sitemap   # generates /sitemap.xml for SEO discoverability
